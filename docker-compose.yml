name: regatta

services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: regatta-kafka
    ports:
      - "${KAFKA_HOST_PORT}:29092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres-office:
    image: postgres:18.6-alpine
    container_name: regatta-postgres-office
    environment:
      POSTGRES_DB: ${OFFICE_DB_NAME}
      POSTGRES_USER: ${OFFICE_DB_USER}
      POSTGRES_PASSWORD: ${OFFICE_DB_PASSWORD}
    ports:
      - "${OFFICE_DB_HOST_PORT}:5432"
    volumes:
      - postgres-office-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OFFICE_DB_USER} -d ${OFFICE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-jury:
    image: postgres:18.6-alpine
    container_name: regatta-postgres-jury
    environment:
      POSTGRES_DB: ${JURY_DB_NAME}
      POSTGRES_USER: ${JURY_DB_USER}
      POSTGRES_PASSWORD: ${JURY_DB_PASSWORD}
    ports:
      - "${JURY_DB_HOST_PORT}:5432"
    volumes:
      - postgres-jury-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JURY_DB_USER} -d ${JURY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  kafka-data:
  postgres-office-data:
  postgres-jury-data:
