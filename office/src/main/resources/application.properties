spring.application.name=office
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/office
spring.datasource.username=office
spring.datasource.password=office

# A4 timeout: 3s to hand out a pooled connection instead of the 30s default, so a
# request fails while the user is still looking at the page
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# A4 timeout: every query here reads one regatta, so 5s means a defect, not load
spring.jpa.properties.jakarta.persistence.query.timeout=5000
spring.transaction.default-timeout=10s

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:29092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# A4 timeout: the outbox publisher runs again a second later, so a send that cannot
# finish in 10s should give up and leave the row unsent rather than hold the thread
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
# A4 timeout: send() blocks waiting for metadata when the broker is gone; the 60s
# default would freeze the publisher for a whole minute per message
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.linger.ms=0

spring.kafka.consumer.group-id=office
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.max-poll-records=50

# A4 timeout: a listener that has not polled for 60s is treated as stuck and loses its
# partitions; handlers here are short database transactions, so this is enough
spring.kafka.consumer.properties.max.poll.interval.ms=60000
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.heartbeat.interval.ms=10000
spring.kafka.consumer.properties.default.api.timeout.ms=10000

spring.kafka.admin.properties.request.timeout.ms=5000
spring.kafka.admin.properties.default.api.timeout.ms=10000

# A4 timeout: HTTP layer; a Thymeleaf form post either completes in seconds or fails
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=15s
server.tomcat.threads.max=50
spring.mvc.async.request-timeout=10s
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
