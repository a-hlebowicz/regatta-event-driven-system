<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zgłoszenia</title>
</head>
<body>

<h1>Zgłoszenia</h1>

<form th:action="@{/entries}" th:object="${form}" method="post">
    <label>
        Regaty
        <input type="number" th:field="*{regattaId}">
    </label>
    <span th:if="${#fields.hasErrors('regattaId')}" th:errors="*{regattaId}"></span>

    <label>
        Numer na żaglu
        <input type="text" th:field="*{sailNumber}">
    </label>
    <span th:if="${#fields.hasErrors('sailNumber')}" th:errors="*{sailNumber}"></span>

    <button type="submit">Dodaj zgłoszenie</button>
</form>

<table>
    <thead>
    <tr>
        <th>Regaty</th>
        <th>Numer na żaglu</th>
        <th>Status</th>
        <th>Wersja</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="entry : ${entries}">
        <td th:text="${entry.regattaId}"></td>
        <td th:text="${entry.sailNumber}"></td>
        <td th:text="${entry.status}"></td>
        <td th:text="${entry.version}"></td>
    </tr>
    <tr th:if="${entries.isEmpty()}">
        <td colspan="4">Brak zgłoszeń</td>
    </tr>
    </tbody>
</table>

</body>
</html>
