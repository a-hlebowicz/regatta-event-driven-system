<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${regatta.name}">Regaty</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav><a th:href="@{/regattas}">Regaty</a> | <a th:href="@{/competitors}">Zawodnicy</a></nav>

<h1 th:text="${regatta.name}">Regaty</h1>

<dl>
    <dt>Miejsce</dt>
    <dd th:text="${regatta.venue}"></dd>
    <dt>Klasa łódek</dt>
    <dd th:text="${regatta.boatClass}"></dd>
    <dt>Termin</dt>
    <dd th:text="${regatta.startDate} + ' do ' + ${regatta.endDate}"></dd>
    <dt>Limit na protest</dt>
    <dd th:text="${regatta.protestTimeLimitMinutes} + ' minut od zamknięcia wyścigu'"></dd>
    <dt>Progi odrzutów</dt>
    <dd th:text="${regatta.discardThresholds.isEmpty()} ? 'brak odrzutów' : ${#strings.listJoin(regatta.discardThresholds, ', ')}"></dd>
    <dt>Status</dt>
    <dd th:text="${regatta.status}"></dd>
</dl>

<h2>Wyścigi</h2>

<table>
    <thead>
    <tr>
        <th class="numeric">Numer</th>
        <th>Planowany start</th>
        <th>Status</th>
        <th>Zamknięty</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="race : ${races}">
        <td class="numeric" th:text="${race.raceNumber}"></td>
        <td th:text="${race.plannedStart}"></td>
        <td th:text="${race.status}"></td>
        <td th:text="${race.closedAt}"></td>
        <td>
            <a th:href="@{/regattas/{regattaId}/races/{raceId}/finish(regattaId=${regatta.id},raceId=${race.id})}"
               th:text="${race.status.name() == 'CLOSED'} ? 'Wyniki' : 'Wpisz metę'"></a>
        </td>
    </tr>
    <tr th:if="${races.isEmpty()}">
        <td colspan="5" class="empty">Brak wyścigów</td>
    </tr>
    </tbody>
</table>

<form th:action="@{/regattas/{id}/races(id=${regatta.id})}" method="post">
    <label>
        <span>Planowany start</span>
        <input type="datetime-local" name="plannedStart" required>
    </label>
    <button type="submit">Dodaj wyścig</button>
</form>

<h2>Zgłoszenia</h2>

<table>
    <thead>
    <tr>
        <th>Numer na żaglu</th>
        <th>Zawodnik</th>
        <th>Klub</th>
        <th>Status</th>
        <th class="numeric">Wersja</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="entry : ${entries}">
        <td th:text="${entry.sailNumber}"></td>
        <td th:text="${entry.competitorName()}"></td>
        <td th:text="${entry.club}"></td>
        <td th:text="${entry.status}"></td>
        <td class="numeric" th:text="${entry.version}"></td>
        <td>
            <form th:if="${entry.status.name() != 'WITHDRAWN'}"
                  th:action="@{/regattas/{regattaId}/entries/{entryId}/withdraw(regattaId=${regatta.id},entryId=${entry.id})}"
                  method="post">
                <button type="submit">Wycofaj</button>
            </form>
        </td>
    </tr>
    <tr th:if="${entries.isEmpty()}">
        <td colspan="6" class="empty">Brak zgłoszeń</td>
    </tr>
    </tbody>
</table>

<form th:action="@{/regattas/{id}/entries(id=${regatta.id})}" th:object="${entryForm}" method="post">
    <label>
        <span>Zawodnik</span>
        <select th:field="*{competitorId}">
            <option value="">wybierz zawodnika</option>
            <option th:each="competitor : ${competitors}"
                    th:value="${competitor.id}"
                    th:text="${competitor.fullName()} + ' (' + ${competitor.club} + ')'"></option>
        </select>
    </label>
    <label>
        <span>Numer na żaglu</span>
        <input type="text" th:field="*{sailNumber}">
    </label>
    <button type="submit">Dodaj zgłoszenie</button>
</form>

</body>
</html>
